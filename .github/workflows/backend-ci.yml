name: Backend CI

on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/backend-ci.yml"
  push:
    paths:
      - "api/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  windows-wrapper:
    name: Maven Wrapper / Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate Maven Wrapper bootstrap
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --version

  verify:
    name: Tests and migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run complete verification
        run: ./mvnw --batch-mode clean verify
